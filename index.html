<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СветоМир — интернет-магазин лампочек</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#1b1c1c",
              "inverse-surface": "#2f3131",
              "on-secondary-container": "#1b1c1c",
              "on-background": "#1a1c1c",
              "inverse-on-surface": "#f0f1f1",
              "surface-dim": "#dadada",
              "secondary-fixed": "#c7c6c6",
              "on-error-container": "#410002",
              "tertiary-fixed": "#5d5e5f",
              "background": "#f9f9f9",
              "secondary": "#5e5e5e",
              "primary-fixed-dim": "#474747",
              "primary-container": "#3b3b3b",
              "on-tertiary-fixed-variant": "#e3e2e2",
              "surface-container-high": "#e8e8e8",
              "on-surface": "#1a1c1c",
              "on-surface-variant": "#474747",
              "surface-container": "#eeeeee",
              "error-container": "#ffdad6",
              "on-tertiary": "#e3e2e2",
              "surface-tint": "#5e5e5e",
              "primary": "#000000",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "tertiary": "#3a3c3c",
              "tertiary-container": "#747575",
              "on-primary-fixed": "#ffffff",
              "secondary-container": "#d5d4d4",
              "on-tertiary-fixed": "#ffffff",
              "on-tertiary-container": "#ffffff",
              "on-secondary": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-container-low": "#f3f3f4",
              "secondary-fixed-dim": "#acabab",
              "on-primary-container": "#ffffff",
              "primary-fixed": "#5e5e5e",
              "on-primary-fixed-variant": "#e2e2e2",
              "tertiary-fixed-dim": "#464747",
              "on-primary": "#e2e2e2",
              "surface": "#f9f9f9",
              "on-secondary-fixed-variant": "#3b3b3c",
              "surface-container-highest": "#e2e2e2",
              "outline-variant": "#c6c6c6",
              "inverse-primary": "#c6c6c6",
              "outline": "#777777",
              "surface-bright": "#f9f9f9"
            },
            borderRadius: {
              DEFAULT: "0px",
              lg: "0px",
              xl: "0px",
              full: "9999px"
            },
            fontFamily: {
              headline: ["Inter"],
              body: ["Inter"],
              label: ["Inter"]
            }
          }
        }
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      .placeholder-x {
        background-image:
          linear-gradient(to top right, transparent calc(50% - 0.5px), #c6c6c6 50%, transparent calc(50% + 0.5px)),
          linear-gradient(to top left, transparent calc(50% - 0.5px), #c6c6c6 50%, transparent calc(50% + 0.5px));
      }
      .wireframe-x {
        background-image:
          linear-gradient(to top right, transparent calc(50% - 1px), #c6c6c6, transparent calc(50% + 1px)),
          linear-gradient(to top left, transparent calc(50% - 1px), #c6c6c6, transparent calc(50% + 1px));
      }
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-surface text-on-surface font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
